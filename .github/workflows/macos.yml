name: Build macOS DMG
on:
  push:
    branches: [main, prepare-2.1]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            architecture: x64
            label: Intel
          - runner: macos-14
            architecture: arm64
            label: AppleSilicon
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
      QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.architecture }}
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Build Monterey-compatible static OpenSSL for Intel
        if: matrix.architecture == 'x64'
        run: python packaging/build_openssl.py
      - name: Build current cryptography without macOS-15 Homebrew runtime
        if: matrix.architecture == 'x64'
        run: python -m pip install --no-binary=cryptography --no-cache-dir cryptography==50.0.2
      - name: Install pinned build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Prepare bundled assets and icon
        run: |
          python packaging/prepare_assets.py
          python packaging/make_icon.py
      - name: Test cache recovery, PDF lifecycle, hiding and macOS paths
        run: QT_QPA_PLATFORM=offscreen python -m unittest discover -s tests -v
      - name: Test source browser startup
        run: |
          mkdir -p build/source-smoke
          cd build/source-smoke
          python ../../app/main.py --browser-self-test
      - name: Build native application
        run: python -m PyInstaller --noconfirm --clean packaging/BiomedReader-macos.spec
      - name: Verify deployment target, signature and packaged startup
        run: |
          python packaging/audit_macos.py 'dist/Biomed Reader.app'
          codesign --verify --deep --strict --verbose=2 'dist/Biomed Reader.app'
          mkdir -p build/smoke
          cd build/smoke
          '../../dist/Biomed Reader.app/Contents/MacOS/BiomedReader' --self-test
          '../../dist/Biomed Reader.app/Contents/MacOS/BiomedReader' --browser-self-test
          cd ../..
          python packaging/pdf_smoke.py
      - name: Collect macOS crash diagnostics
        if: failure()
        run: |
          sleep 5
          python packaging/crash_summary.py
      - name: Make and verify DMG
        run: |
          mkdir -p build/dmg outputs
          cp -R 'dist/Biomed Reader.app' build/dmg/
          ln -s /Applications build/dmg/Applications
          cp README.md build/dmg/README.md
          hdiutil create -volname 'Biomed Reader' -srcfolder build/dmg -format UDZO -ov 'outputs/BiomedReader_2.1_macOS12_${{ matrix.label }}.dmg'
          hdiutil verify 'outputs/BiomedReader_2.1_macOS12_${{ matrix.label }}.dmg'
          cd outputs
          shasum -a 256 *.dmg > 'SHA256_${{ matrix.label }}.txt'
      - uses: actions/upload-artifact@v4
        with:
          name: macOS-${{ matrix.label }}
          path: outputs/*
          retention-days: 14
  publish:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: macOS-*
          path: release-assets
          merge-multiple: true
      - name: Publish DMG files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v2.1 --repo '${{ github.repository }}' >/dev/null 2>&1; then
            gh release create v2.1 --repo '${{ github.repository }}' --target '${{ github.sha }}' --title '刊禾 · Biomed Reader 2.1' --notes-file RELEASE_NOTES.md
          fi
          gh api --method PATCH 'repos/${{ github.repository }}/git/refs/tags/v2.1' -f sha='${{ github.sha }}' -F force=true
          gh release edit v2.1 --repo '${{ github.repository }}' --title '刊禾 · Biomed Reader 2.1' --notes-file RELEASE_NOTES.md --latest
          gh release upload v2.1 release-assets/* --repo '${{ github.repository }}' --clobber

